[project]
name = "email-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pydantic==2.14.3",
    "pypdf==7.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
